<!DOCTYPE html>
<html lang="ja" class="scroll-boot-lock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>1年後の自分からの返信</title>

  <!--
    iPhoneのカメラ/QRコードからChromeを外部起動したとき、Chrome側が保存済みの
    スクロール位置やフォーカスを遅れて復元することがある。
    外部CDNやReactより先に、初期表示中だけルートスクロールを物理的に固定する。
  -->
  <style id="scroll-boot-critical">
    html.scroll-boot-lock,
    html.scroll-boot-lock body {
      overflow: hidden !important;
      overscroll-behavior: none !important;
    }
    html.scroll-boot-lock body {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
    }
  </style>
  <script>
    (() => {
      const root = document.documentElement;
      const BOOT_FALLBACK_MS = 4000;
      const FONT_WAIT_LIMIT_MS = 800;
      const INITIAL_SETTLE_GUARD_MS = 1800;

      let appReady = false;
      let pageLoaded = document.readyState === 'complete';
      let releasing = false;
      let released = false;
      let userInteracted = false;
      let bootFrameId = 0;

      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      const forceTop = () => {
        try {
          window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        } catch (_) {
          window.scrollTo(0, 0);
        }

        const scrollingElement = document.scrollingElement;
        if (scrollingElement) scrollingElement.scrollTop = 0;
        root.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      };

      const twoFrames = () => new Promise(resolve => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });

      // React内の画面切り替えでも使う。短いバーストで復元処理より後まで0を維持する。
      const resetPageScroll = () => {
        forceTop();
        requestAnimationFrame(() => {
          forceTop();
          requestAnimationFrame(forceTop);
        });
        setTimeout(forceTop, 60);
      };
      window.resetLetterPageScroll = resetPageScroll;

      const noteUserInteraction = () => {
        userInteracted = true;
      };

      window.addEventListener('touchstart', noteUserInteraction, {
        capture: true,
        passive: true,
        once: true
      });
      window.addEventListener('pointerdown', noteUserInteraction, {
        capture: true,
        passive: true,
        once: true
      });
      window.addEventListener('wheel', noteUserInteraction, {
        capture: true,
        passive: true,
        once: true
      });
      window.addEventListener('keydown', noteUserInteraction, {
        capture: true,
        once: true
      });

      // Chromeが復元したフォーカスで特定ボタンへ自動スクロールするケースも初期表示中だけ抑止。
      const stopAutomaticFocusScroll = (event) => {
        if (userInteracted) return;
        const target = event.target;
        if (target && typeof target.blur === 'function') target.blur();
        forceTop();
      };
      document.addEventListener('focusin', stopAutomaticFocusScroll, true);

      // 遅れて発生するスクロール復元・viewport更新を、初期ロック中は常に打ち消す。
      const keepTopDuringBoot = () => {
        if (!released || !userInteracted) forceTop();
      };
      window.addEventListener('scroll', keepTopDuringBoot, {
        capture: true,
        passive: true
      });

      const viewport = window.visualViewport;
      if (viewport) {
        viewport.addEventListener('resize', keepTopDuringBoot, { passive: true });
        viewport.addEventListener('scroll', keepTopDuringBoot, { passive: true });
      }

      const bootLoop = () => {
        if (released) return;
        forceTop();
        bootFrameId = requestAnimationFrame(bootLoop);
      };

      const waitForFonts = async () => {
        if (!document.fonts || !document.fonts.ready) return;
        await Promise.race([
          document.fonts.ready.catch(() => undefined),
          new Promise(resolve => setTimeout(resolve, FONT_WAIT_LIMIT_MS))
        ]);
      };

      const cleanupBootListeners = () => {
        cancelAnimationFrame(bootFrameId);
        document.removeEventListener('focusin', stopAutomaticFocusScroll, true);
        window.removeEventListener('scroll', keepTopDuringBoot, true);
        if (viewport) {
          viewport.removeEventListener('resize', keepTopDuringBoot);
          viewport.removeEventListener('scroll', keepTopDuringBoot);
        }
      };

      const releaseBootLock = async (force = false) => {
        if (released || releasing) return;
        if (!force && (!appReady || !pageLoaded)) return;
        releasing = true;

        await waitForFonts();
        await twoFrames();
        forceTop();

        // 先頭を確定してから固定を解除する。
        root.classList.remove('scroll-boot-lock');
        await twoFrames();
        forceTop();

        released = true;
        cancelAnimationFrame(bootFrameId);
        setTimeout(cleanupBootListeners, INITIAL_SETTLE_GUARD_MS);

        // iOS Chromeの遅いviewport/フォーカス復元に備えた最後の補正。
        // ユーザーが操作を始めた後は絶対に巻き戻さない。
        const correctUnlessInteracted = () => {
          if (!userInteracted) forceTop();
        };
        requestAnimationFrame(() => {
          correctUnlessInteracted();
          requestAnimationFrame(correctUnlessInteracted);
        });
        [0, 100, 350, 800, 1500].forEach(delay => {
          setTimeout(correctUnlessInteracted, delay);
        });
      };

      window.markLetterAppReady = () => {
        appReady = true;
        releaseBootLock();
      };

      document.addEventListener('DOMContentLoaded', forceTop, { once: true });

      if (!pageLoaded) {
        window.addEventListener('load', () => {
          pageLoaded = true;
          forceTop();
          releaseBootLock();
        }, { once: true });
      }

      // bfcacheから戻った場合も、復元スクロールより後に先頭へ戻す。
      window.addEventListener('pageshow', (event) => {
        if (!released) {
          forceTop();
        } else if (event.persisted) {
          resetPageScroll();
        }
      });

      // CDN障害などでReactが起動しない場合でも固定を残し続けない。
      setTimeout(() => {
        if (!released) {
          appReady = true;
          pageLoaded = true;
          releaseBootLock(true);
        }
      }, BOOT_FALLBACK_MS);

      forceTop();
      bootLoop();
    })();
  </script>

  <style>

      background-blend-mode: soft-light;
    }
    .letter-shadow {
      box-shadow:
        0 1px 1px rgba(0,0,0,0.08),
        0 2px 2px rgba(0,0,0,0.08),
        0 4px 4px rgba(0,0,0,0.08),
        0 8px 8px rgba(0,0,0,0.08),
        0 16px 16px rgba(0,0,0,0.08);
    }
    .handwriting { font-family: 'Caveat', cursive; }
    .japanese-serif { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; }
    .japanese-sans { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 400; }

    /* iOS系ブラウザのルートスクロールを一意にし、アンカー補正を無効化する */
    html {
      min-height: 100%;
      background: #fef3c7;
      scroll-behavior: auto;
    }
    html, body, #root, .app-shell {
      overflow-anchor: none;
    }
    body {
      margin: 0;
      min-height: 100%;
      /* hiddenの後にclipを置き、対応ブラウザでは縦方向のscroll container化を避ける */
      overflow-x: hidden;
      overflow-x: clip;
    }
    #root { min-height: 100%; }
    .app-shell {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-x: clip;
    }
    .app-content {
      padding-top: calc(2rem + env(safe-area-inset-top, 0px));
      /* Safari下部ツールバー分の余白も含め、フッターまで確実にスクロールできるようにする */
      padding-bottom: calc(8rem + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 768px) {
      .app-content {
        padding-top: 4rem;
        padding-bottom: 4rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-float, .animate-fade-in-up, .shimmer-bg { animation: none !important; }
      .animate-fade-in-up { opacity: 1; transform: none; }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useLayoutEffect } = React;

    /* ============================================================
       画像の圧縮（スマホ写真をJPEGに変換＆縮小）
       ============================================================ */
    function compressToJpegDataUrl(file, maxSide = 1280, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            const w0 = img.naturalWidth || img.width;
            const h0 = img.naturalHeight || img.height;

            const scale = Math.min(1, maxSide / Math.max(w0, h0));
            const w = Math.max(1, Math.round(w0 * scale));
            const h = Math.max(1, Math.round(h0 * scale));

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            URL.revokeObjectURL(url);
            resolve(dataUrl);
          } catch (e) {
            URL.revokeObjectURL(url);
            reject(e);
          }
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('画像を読み込めませんでした。別の形式の画像でお試しください。'));
        };

        img.src = url;
      });
    }

    function base64FromDataUrl(dataUrl) {
      if (typeof dataUrl !== 'string') return '';
      const i = dataUrl.indexOf(',');
      if (i === -1) return '';
      return dataUrl.slice(i + 1);
    }

    async function readErrorMessage(response) {
      const raw = await response.text();
      try {
        const j = JSON.parse(raw);
        return j?.error || j?.message || raw;
      } catch {
        return raw;
      }
    }

    /* ============================================================
       手紙の暗号化（ブラウザ内で暗号化してから送信する）
       鍵はメールのURLの中だけに置き、サーバーには平文で残さない
       ============================================================ */
    function bytesToBase64(bytes) {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToUrlSafe(b64) {
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function encryptCapsule(obj) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error('このブラウザでは暗号化に対応していません。別のブラウザでお試しください。');
      }
      const key = await crypto.subtle.generateKey(
        { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
      );
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const plain = new TextEncoder().encode(JSON.stringify(obj));
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
      const rawKey = await crypto.subtle.exportKey('raw', key);

      return {
        keyB64Url: base64ToUrlSafe(bytesToBase64(new Uint8Array(rawKey))),
        capsule: {
          v: 1,
          alg: 'AES-GCM',
          iv: bytesToBase64(iv),
          ct: bytesToBase64(new Uint8Array(cipher))
        }
      };
    }

    /* ============================================================
       日付ユーティリティ（送信時刻は日本時間の18時に固定）
       ============================================================ */
    function oneYearLater(from = new Date()) {
      return new Date(from.getFullYear() + 1, from.getMonth(), from.getDate());
    }

    /** 日本時間での YYYY-MM-DD */
    function jstDateString(date = new Date()) {
      return new Date(date.getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10);
    }

    /** 日本時間の日付を、年・日単位でずらす */
    function shiftJstDate(dateStr, { years = 0, days = 0 } = {}) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const next = new Date(Date.UTC(y + years, m - 1, d + days));
      return next.toISOString().slice(0, 10);
    }

    function formatJaDate(d) {
      return d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    /** YYYY-MM-DD を「2027年9月3日」の形にする */
    function formatJaDateStr(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      if (!y || !m || !d) return '';
      return `${y}年${m}月${d}日`;
    }

    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim());
    }

    /** 便箋の行ごとの改行を取り除き、段落の区切り（空行）だけを残す */
    function normalizeExtractedLineBreaks(text) {
      if (!text) return text;
      return String(text)
        .replace(/\r\n/g, '\n')
        .split(/\n[ \t]*\n+/)
        .map(paragraph =>
          paragraph
            .split('\n')
            .map(line => line.trim())
            .filter(line => line.length > 0)
            .join('')
        )
        .filter(paragraph => paragraph.length > 0)
        .join('\n\n');
    }

    /* ============================================================
       装飾
       ============================================================ */
    const FloatingParticles = () => {
      const particles = Array.from({ length: 15 }, (_, i) => ({
        id: i,
        left: Math.random() * 100,
        delay: Math.random() * 5,
        duration: 5 + Math.random() * 5,
        size: 4 + Math.random() * 8,
        opacity: 0.1 + Math.random() * 0.3
      }));

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden">
          {particles.map(p => (
            <div
              key={p.id}
              className="absolute rounded-full"
              style={{
                left: `${p.left}%`,
                top: '-20px',
                width: p.size,
                height: p.size,
                background: `rgba(180, 140, 100, ${p.opacity})`,
                animation: `float ${p.duration}s ease-in-out infinite`,
                animationDelay: `${p.delay}s`
              }}
            />
          ))}
        </div>
      );
    };

    const LetterDisplay = ({ content, isFromFuture, delay = 0 }) => {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const timer = setTimeout(() => setVisible(true), delay);
        return () => clearTimeout(timer);
      }, [delay]);

      if (!visible) return null;

      return (
        <div
          className={`
            relative p-8 md:p-12 rounded-sm letter-shadow
            ${isFromFuture
              ? 'bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50'
              : 'bg-gradient-to-br from-stone-50 via-amber-50 to-stone-100'
            }
            paper-texture animate-fade-in-up
          `}
          style={{
            transform: isFromFuture ? 'rotate(0.5deg)' : 'rotate(-0.5deg)',
            animationDelay: `${delay}ms`
          }}
        >
          <div className="absolute top-4 right-4 w-16 h-16 opacity-20">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              <path d="M90 10 L90 90 L10 90" fill="none" stroke="#8B7355" strokeWidth="2"/>
              <circle cx="90" cy="10" r="4" fill="#8B7355"/>
            </svg>
          </div>

          <div className="mb-6 pb-4 border-b border-amber-200/50"/>

          <div className="japanese-sans text-lg text-stone-700 leading-relaxed whitespace-pre-wrap">
            {content}
          </div>

          {isFromFuture && (
            <div className="mt-8 pt-4 border-t border-amber-200/30 text-right">
              <p className="handwriting text-xl text-amber-700/80">
                1年後の私より
              </p>
              <p className="japanese-sans text-base text-stone-500 mt-2">
                {formatJaDate(oneYearLater())}
              </p>
            </div>
          )}
        </div>
      );
    };

    const LoadingAnimation = ({ message }) => (
      <div className="flex flex-col items-center justify-center py-12 animate-fade-in-up">
        <div className="relative w-24 h-24 mb-6">
          <div className="absolute inset-0 flex items-center justify-center">
            <svg viewBox="0 0 100 80" className="w-20 h-16 animate-float">
              <rect x="5" y="15" width="90" height="60" rx="3" fill="#F5E6D3" stroke="#C4A574" strokeWidth="2"/>
              <path d="M5 18 L50 50 L95 18" fill="none" stroke="#C4A574" strokeWidth="2"/>
              <path d="M5 75 L35 50" fill="none" stroke="#C4A574" strokeWidth="1.5"/>
              <path d="M95 75 L65 50" fill="none" stroke="#C4A574" strokeWidth="1.5"/>
            </svg>
          </div>
          <div className="absolute inset-0 rounded-full shimmer-bg opacity-50"/>
        </div>
        <p className="japanese-serif text-xl text-amber-800/80">{message}</p>
        <div className="flex gap-1 mt-3">
          {[0, 1, 2].map(i => (
            <div
              key={i}
              className="w-2 h-2 rounded-full bg-amber-400"
              style={{ animation: 'float 1s ease-in-out infinite', animationDelay: `${i * 0.2}s` }}
            />
          ))}
        </div>
      </div>
    );

    const StepIndicator = ({ current, mode }) => {
      const labels = [
        mode === 'text' ? '手紙を書く' : '手紙の画像をアップロード',
        '返信を受け取る',
        '1年後に送る'
      ];

      return (
        <div className="mb-8 animate-fade-in-up">
          <div className="grid grid-cols-3 gap-1 md:gap-4 max-w-xl mx-auto text-stone-600 japanese-sans text-xs md:text-base font-medium">
            {labels.map((label, i) => {
              const n = i + 1;
              const active = n <= current;
              return (
                <div key={label} className="flex flex-col items-center text-center">
                  <div className={`w-9 h-9 md:w-10 md:h-10 rounded-full border-2 flex items-center justify-center mb-2 transition-colors duration-300 ${
                    active ? 'bg-sky-50 border-sky-300' : 'bg-white/40 border-stone-200'
                  }`}>
                    <span className={active ? 'text-sky-600' : 'text-stone-400'}>{n}</span>
                  </div>
                  <span className={active ? '' : 'text-stone-400'}>{label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const ImageUploadBox = ({ index, imagePreview, preparing, onUploadClick, onDrop, onRemove }) => {
      const handleDragOver = (e) => e.preventDefault();

      return (
        <div
          onClick={onUploadClick}
          onDrop={onDrop}
          onDragOver={handleDragOver}
          className={`
            relative border-2 border-dashed rounded-xl p-4 text-center cursor-pointer
            transition-all duration-300 bg-white/50 flex-1 min-h-[160px] flex flex-col items-center justify-center
            ${imagePreview ? 'border-amber-400' : 'border-amber-200 hover:border-amber-300 hover:bg-white/70'}
          `}
        >
          {imagePreview ? (
            <div className="space-y-2 relative w-full">
              <img src={imagePreview} alt={`手紙${index + 1}`} className="max-h-32 mx-auto rounded-lg shadow-md"/>
              <p className="japanese-sans text-sm font-medium text-amber-700">{index + 1}枚目</p>
              <button
                onClick={(e) => { e.stopPropagation(); onRemove(); }}
                className="absolute top-0 right-0 w-6 h-6 bg-red-400 text-white rounded-full text-xs hover:bg-red-500 transition-colors"
                aria-label={`${index + 1}枚目を削除`}
              >
                ✕
              </button>
              {preparing && <p className="japanese-sans text-sm text-stone-500">最適化中…</p>}
            </div>
          ) : (
            <div className="space-y-2">
              <div className="w-12 h-12 mx-auto opacity-50">
                <svg viewBox="0 0 64 64" className="w-full h-full">
                  <rect x="8" y="12" width="48" height="40" rx="4" fill="none" stroke="#8B7355" strokeWidth="2"/>
                  <circle cx="22" cy="28" r="5" fill="none" stroke="#8B7355" strokeWidth="2"/>
                  <path d="M8 44 L24 32 L36 42 L48 30 L56 38" fill="none" stroke="#8B7355" strokeWidth="2"/>
                </svg>
              </div>
              <p className="japanese-sans text-stone-600 text-base font-medium">{index + 1}枚目</p>
              <p className="japanese-sans text-stone-500 text-sm font-medium">ここをタップ or クリック</p>
              {preparing && <p className="japanese-sans text-sm text-stone-500">最適化中…</p>}
            </div>
          )}
        </div>
      );
    };

    /* ============================================================
       メインアプリ
       ============================================================ */
    const App = () => {
      const [mode, setMode] = useState('photo');          // 'photo' | 'text'
      const [step, setStep] = useState('compose');        // compose | reply | send | done

      const [images, setImages] = useState([null, null]);
      const [imagePreviews, setImagePreviews] = useState([null, null]);
      const [preparing, setPreparing] = useState([false, false]);
      const [typedText, setTypedText] = useState('');

      const [letterText, setLetterText] = useState('');   // 読み取り結果 or 入力テキスト
      const [futureReply, setFutureReply] = useState('');
      const [aiSkipped, setAiSkipped] = useState(false);

      const [email, setEmail] = useState('');
      const [sendDate, setSendDate] = useState(() => shiftJstDate(jstDateString(), { years: 1 }));
      const [sentLabel, setSentLabel] = useState('');

      const [loading, setLoading] = useState(false);
      const [loadingMessage, setLoadingMessage] = useState('');
      const [error, setError] = useState('');

      const fileInputRef1 = useRef(null);
      const fileInputRef2 = useRef(null);

      // 初回DOMコミットをhead側のスクロール制御へ通知する（paint前に実行）。
      useLayoutEffect(() => {
        window.markLetterAppReady?.();
      }, []);

      const API_BASE = (window.API_BASE ? String(window.API_BASE).replace(/\/$/, '') : '');
      const API_URL = API_BASE + '/api/process-letter';
      const SCHEDULE_URL = API_BASE + '/api/schedule';

      const hasAtLeastOneImage = Boolean(imagePreviews[0] || imagePreviews[1]);
      const isAnyPreparing = preparing[0] || preparing[1];
      const hasTypedText = typedText.trim().length > 0;
      const hasContent = mode === 'photo' ? hasAtLeastOneImage : hasTypedText;

      /* ---------- 画像 ---------- */
      const prepareImage = async (file, index) => {
        setPreparing(prev => { const n = [...prev]; n[index] = true; return n; });
        setError('');
        try {
          const dataUrl = await compressToJpegDataUrl(file, 1280, 0.75);
          setImagePreviews(prev => { const n = [...prev]; n[index] = dataUrl; return n; });
          setImages(prev => { const n = [...prev]; n[index] = file; return n; });
        } catch (e) {
          setImages(prev => { const n = [...prev]; n[index] = null; return n; });
          setImagePreviews(prev => { const n = [...prev]; n[index] = null; return n; });
          setError(e?.message || '画像を準備できませんでした。別の画像でお試しください。');
        } finally {
          setPreparing(prev => { const n = [...prev]; n[index] = false; return n; });
        }
      };

      const handleImageUpload = async (e, index) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError('画像ファイルを選んでください。');
          return;
        }
        await prepareImage(file, index);
        e.target.value = '';
      };

      const handleUploadClick = (index) => {
        (index === 0 ? fileInputRef1 : fileInputRef2).current?.click();
      };

      const handleDrop = async (e, index) => {
        e.preventDefault();
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError('画像ファイルをドロップしてください。');
          return;
        }
        await prepareImage(file, index);
      };

      const removeImage = (index) => {
        setImages(prev => { const n = [...prev]; n[index] = null; return n; });
        setImagePreviews(prev => { const n = [...prev]; n[index] = null; return n; });
      };

      /* ---------- AIで読み取り＋返信 ---------- */
      const processLetter = async () => {
        if (!hasContent) {
          setError(mode === 'photo'
            ? '手紙の画像を少なくとも1枚アップロードしてください。'
            : '手紙の内容を入力してください。');
          return;
        }
        if (mode === 'photo' && isAnyPreparing) {
          setError('画像を準備中です。少し待ってから実行してください。');
          return;
        }

        setLoading(true);
        setError('');

        try {
          let combinedText = '';

          if (mode === 'photo') {
            const texts = [];
            for (let i = 0; i < 2; i++) {
              if (!imagePreviews[i]) continue;
              setLoadingMessage(`手紙${i + 1}枚目を読み取っています...`);

              const base64Image = base64FromDataUrl(imagePreviews[i]);
              if (!base64Image) throw new Error(`画像${i + 1}を変換できませんでした。`);

              const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'extract', imageBase64: base64Image })
              });
              if (!res.ok) {
                throw new Error(await readErrorMessage(res) || `${i + 1}枚目を読み取れませんでした。`);
              }
              const data = await res.json();
              texts.push(normalizeExtractedLineBreaks(data.text));
            }
            combinedText = texts.join('\n\n');
          } else {
            combinedText = typedText.trim();
          }

          setLetterText(combinedText);

          setLoadingMessage('1年後の自分が返信を書いています...');
          const replyRes = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'reply', extractedText: combinedText })
          });
          if (!replyRes.ok) {
            throw new Error(await readErrorMessage(replyRes) || '返信を生成できませんでした。');
          }
          const replyData = await replyRes.json();

          setFutureReply(replyData.reply);
          setAiSkipped(false);
          setStep('reply');
        } catch (err) {
          setError(err?.message || '処理中に問題が発生しました。もう一度お試しください。');
        } finally {
          setLoading(false);
          setLoadingMessage('');
        }
      };

      /* ---------- AI返信をスキップ ---------- */
      const skipToSend = () => {
        if (!hasContent) {
          setError(mode === 'photo'
            ? '手紙の画像を少なくとも1枚アップロードしてください。'
            : '手紙の内容を入力してください。');
          return;
        }
        if (mode === 'photo' && isAnyPreparing) {
          setError('画像を準備中です。少し待ってから実行してください。');
          return;
        }
        setError('');
        setLetterText(mode === 'text' ? typedText.trim() : '');
        setFutureReply('');
        setAiSkipped(true);
        setStep('send');
      };

      /* ---------- 指定した日に送る ---------- */
      const defaultSendDate = shiftJstDate(jstDateString(), { years: 1 });
      const minSendDate = jstDateString();
      const maxSendDate = shiftJstDate(jstDateString(), { years: 2 });
      const sendDateValid =
        /^\d{4}-\d{2}-\d{2}$/.test(sendDate) && sendDate >= minSendDate && sendDate <= maxSendDate;
      const canSchedule = isValidEmail(email) && sendDateValid;

      const scheduleLetter = async () => {
        if (!isValidEmail(email)) {
          setError('メールアドレスの形式を確認してください。');
          return;
        }
        if (!sendDateValid) {
          setError('送信日は、今日から2年後までの範囲で選んでください。');
          return;
        }

        setLoading(true);
        setLoadingMessage('手紙を封をして預かっています...');
        setError('');

        try {
          const capsuleData = {
            v: 1,
            createdAt: new Date().toISOString(),
            images: imagePreviews.filter(Boolean),
            letterText: letterText || '',
            letterTextSource: letterText ? (mode === 'photo' ? 'ai-ocr' : 'typed') : null,
            reply: futureReply || '',
            aiSkipped
          };

          const { keyB64Url, capsule } = await encryptCapsule(capsuleData);

          const res = await fetch(SCHEDULE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email.trim(),
              capsule,
              key: keyB64Url,
              sendDate
            })
          });

          if (!res.ok) {
            throw new Error(await readErrorMessage(res) || '予約できませんでした。');
          }

          const data = await res.json();
          setSentLabel(data.sendAtLabel || `${formatJaDateStr(sendDate)} 18時頃`);
          setStep('done');
        } catch (err) {
          setError(err?.message || '予約できませんでした。時間をおいてお試しください。');
        } finally {
          setLoading(false);
          setLoadingMessage('');
        }
      };

      const resetApp = () => {
        setImages([null, null]);
        setImagePreviews([null, null]);
        setPreparing([false, false]);
        setTypedText('');
        setLetterText('');
        setFutureReply('');
        setAiSkipped(false);
        setEmail('');
        setSendDate(shiftJstDate(jstDateString(), { years: 1 }));
        setSentLabel('');
        setError('');
        setStep('compose');
      };

      const stepNumber = step === 'compose' ? 1 : step === 'reply' ? 2 : 3;

      // 画面（step）が切り替わる際も、paint前にページ先頭を確定する。
      useLayoutEffect(() => {
        const resetPageScroll = window.resetLetterPageScroll || (() => window.scrollTo(0, 0));
        resetPageScroll();
      }, [step]);

      const ErrorBox = () => error ? (
        <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg animate-fade-in-up">
          <p className="japanese-sans text-red-700 text-base font-medium whitespace-pre-wrap">{error}</p>
        </div>
      ) : null;

      return (
        <div className="app-shell bg-gradient-to-br from-amber-100 via-orange-50 to-stone-100 relative">
          <FloatingParticles />

          <div className="absolute top-0 right-0 w-96 h-96 bg-amber-200/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"/>
          <div className="absolute bottom-0 left-0 w-80 h-80 bg-orange-200/20 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"/>

          <div className="app-content relative z-10 container mx-auto px-4">
            <header className="text-center mb-12">
              <h1 className="japanese-serif text-3xl md:text-4xl text-amber-900 mb-3">
                1年後の自分からの返信
              </h1>
            </header>

            {/* ---------------- STEP 1: 手紙を用意する ---------------- */}
            {step === 'compose' && (
              <div className="max-w-2xl mx-auto">
                <StepIndicator current={stepNumber} mode={mode} />

                {mode === 'photo' ? (
                  <div className="mb-6 animate-fade-in-up" style={{ animationDelay: '100ms' }}>
                    <label className="block japanese-sans text-stone-700 mb-2 text-base font-medium">
                      手紙の画像をアップロード（1〜2枚）
                    </label>

                    <input ref={fileInputRef1} type="file" accept="image/*"
                           onChange={(e) => handleImageUpload(e, 0)} className="hidden"/>
                    <input ref={fileInputRef2} type="file" accept="image/*"
                           onChange={(e) => handleImageUpload(e, 1)} className="hidden"/>

                    <div className="flex gap-4">
                      <ImageUploadBox
                        index={0}
                        imagePreview={imagePreviews[0]}
                        preparing={preparing[0]}
                        onUploadClick={() => handleUploadClick(0)}
                        onDrop={(e) => handleDrop(e, 0)}
                        onRemove={() => removeImage(0)}
                      />
                      <ImageUploadBox
                        index={1}
                        imagePreview={imagePreviews[1]}
                        preparing={preparing[1]}
                        onUploadClick={() => handleUploadClick(1)}
                        onDrop={(e) => handleDrop(e, 1)}
                        onRemove={() => removeImage(1)}
                      />
                    </div>

                    <p className="japanese-sans text-sm text-stone-500 mt-2 text-center font-medium">
                      ※ 便箋2枚の場合は2枚ともアップロードしてください
                    </p>
                  </div>
                ) : (
                  <div className="mb-6 animate-fade-in-up" style={{ animationDelay: '100ms' }}>
                    <label htmlFor="letter-text" className="block japanese-sans text-stone-700 mb-2 text-base font-medium">
                      1年後の自分への手紙を入力
                    </label>
                    <textarea
                      id="letter-text"
                      value={typedText}
                      onChange={(e) => setTypedText(e.target.value)}
                      rows={12}
                      maxLength={4000}
                      placeholder="1年後の自分へ&#10;&#10;今考えていること、悩んでいること、叶えたいことを自由に書いてください。"
                      className="w-full p-4 rounded-xl border-2 border-amber-200 bg-white/70 japanese-sans text-base
                                 text-stone-700 leading-relaxed resize-y
                                 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-200"
                    />
                    <p className="japanese-sans text-sm text-stone-500 mt-2 text-right font-medium">
                      {typedText.length} / 4000文字
                    </p>
                  </div>
                )}

                {/* 入力方法の切り替え */}
                <div className="mb-8 text-center">
                  <button
                    onClick={() => { setMode(mode === 'photo' ? 'text' : 'photo'); setError(''); }}
                    className="japanese-sans text-base font-medium text-amber-700 underline underline-offset-4
                               decoration-amber-300 hover:text-amber-800 hover:decoration-amber-500 transition-colors"
                  >
                    {mode === 'photo'
                      ? '写真でなく直接手紙を入力する場合はこちら'
                      : '写真をアップロードして手紙を送る場合はこちら'}
                  </button>
                </div>

                <ErrorBox />

                <div className="text-center animate-fade-in-up" style={{ animationDelay: '200ms' }}>
                  {loading ? (
                    <LoadingAnimation message={loadingMessage} />
                  ) : (
                    <div className="flex flex-col items-center gap-4">
                      <button
                        onClick={skipToSend}
                        disabled={!hasContent || isAnyPreparing}
                        className={`
                          px-8 py-3 rounded-full japanese-sans text-base md:text-lg font-medium border-2
                          transition-all duration-300
                          ${hasContent && !isAnyPreparing
                            ? 'border-amber-300 text-amber-700 hover:bg-amber-50'
                            : 'border-stone-200 text-stone-400 cursor-not-allowed'}
                        `}
                      >
                        AI生成の返信を受け取らず、1年後への送信に進む
                      </button>

                      <button
                        onClick={processLetter}
                        disabled={!hasContent || isAnyPreparing}
                        className={`
                          px-8 py-4 rounded-full japanese-serif text-xl
                          transition-all duration-300 transform
                          ${hasContent && !isAnyPreparing
                            ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-lg hover:shadow-xl hover:scale-105'
                            : 'bg-stone-200 text-stone-400 cursor-not-allowed'}
                        `}
                      >
                        {isAnyPreparing ? '画像を最適化中…' : 'AI生成の返信を受け取る'}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ---------------- STEP 2: 返信 ---------------- */}
            {step === 'reply' && (
              <div className="max-w-3xl mx-auto space-y-8">
                <StepIndicator current={2} mode={mode} />

                <div>
                  <h2 className="japanese-serif text-2xl text-amber-800 mb-4 text-center">
                    {mode === 'photo' ? '📜 読み取った手紙' : '📜 入力した手紙'}
                  </h2>
                  <LetterDisplay content={letterText} isFromFuture={false} delay={0} />
                </div>

                <div className="flex items-center justify-center py-4">
                  <div className="flex-1 h-px bg-gradient-to-r from-transparent via-amber-300 to-transparent"/>
                  <div className="px-4">
                    <svg viewBox="0 0 40 40" className="w-10 h-10 opacity-60">
                      <circle cx="20" cy="20" r="18" fill="none" stroke="#C4A574" strokeWidth="1.5"/>
                      <path d="M20 8 L20 32 M12 16 L20 8 L28 16" fill="none" stroke="#C4A574" strokeWidth="1.5" transform="rotate(180 20 20)"/>
                    </svg>
                  </div>
                  <div className="flex-1 h-px bg-gradient-to-r from-transparent via-amber-300 to-transparent"/>
                </div>

                <div>
                  <h2 className="japanese-serif text-2xl text-amber-800 mb-4 text-center">
                    ✉️ 1年後の自分からの返信
                  </h2>
                  <LetterDisplay content={futureReply} isFromFuture={true} delay={500} />
                </div>

                <div className="text-center pt-8 space-y-4 animate-fade-in-up" style={{ animationDelay: '1000ms' }}>
                  <button
                    onClick={() => { setError(''); setStep('send'); }}
                    className="px-8 py-4 rounded-full japanese-serif text-xl bg-gradient-to-r from-amber-500 to-orange-500
                               text-white shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-300 transform"
                  >
                    1年後の自分に送る
                  </button>
                  <div>
                    <button
                      onClick={resetApp}
                      className="px-6 py-3 rounded-full japanese-sans text-lg font-medium text-amber-700
                                 border-2 border-amber-300 hover:bg-amber-50 transition-all duration-300"
                    >
                      別の手紙を書く
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ---------------- STEP 3: 1年後に送る ---------------- */}
            {step === 'send' && (
              <div className="max-w-2xl mx-auto">
                <StepIndicator current={3} mode={mode} />

                <div className="p-8 md:p-10 rounded-sm letter-shadow paper-texture animate-fade-in-up
                                bg-gradient-to-br from-stone-50 via-amber-50 to-stone-100">
                  <h2 className="japanese-serif text-2xl text-amber-800 mb-6 text-center">
                    今日書いた手紙を、1年後に受け取ることができます
                  </h2>

                  <p className="japanese-sans text-lg text-stone-700 mb-6 text-center leading-relaxed">
                    1年後も有効なメールアドレスを入力してください
                  </p>

                  <label htmlFor="email" className="sr-only">メールアドレス</label>
                  <input
                    id="email"
                    type="email"
                    inputMode="email"
                    autoComplete="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="example@mail.com"
                    className="w-full p-4 rounded-xl border-2 border-amber-200 bg-white/80 japanese-sans text-lg
                               text-stone-700 text-center
                               focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-200"
                  />

                  <div className="mt-6 space-y-2">
                    <p className="japanese-sans text-sm text-stone-600 leading-relaxed">
                      ※このメールアドレスは、手紙の送信のみに使用します。
                    </p>
                    <p className="japanese-sans text-sm text-stone-600 leading-relaxed">
                      ※手紙の内容も暗号化されるため、管理者や第三者が読むことはありません。
                    </p>
                  </div>

                  <div className="mt-6 pt-6 border-t border-amber-200/60">
                    <label htmlFor="send-date" className="block japanese-sans text-base text-stone-700 mb-2 text-center">
                      送信日（タップで変更可能）
                    </label>
                    <input
                      id="send-date"
                      type="date"
                      value={sendDate}
                      min={minSendDate}
                      max={maxSendDate}
                      onChange={(e) => { setSendDate(e.target.value); setError(''); }}
                      className="w-full p-4 rounded-xl border-2 border-amber-200 bg-white/80 japanese-sans text-lg
                                 text-stone-700 text-center
                                 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-200"
                    />

                    <p className="japanese-sans text-sm text-stone-500 mt-3 text-center leading-relaxed">
                      {sendDateValid
                        ? `${formatJaDateStr(sendDate)}の18時頃に届きます`
                        : '今日から2年後までの日付を選んでください'}
                    </p>
                  </div>
                </div>

                <div className="mt-8">
                  <ErrorBox />
                </div>

                <div className="text-center animate-fade-in-up" style={{ animationDelay: '200ms' }}>
                  {loading ? (
                    <LoadingAnimation message={loadingMessage} />
                  ) : (
                    <div className="flex flex-col items-center gap-4">
                      <button
                        onClick={scheduleLetter}
                        disabled={!canSchedule}
                        className={`
                          px-8 py-4 rounded-full japanese-serif text-xl transition-all duration-300 transform
                          ${canSchedule
                            ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-lg hover:shadow-xl hover:scale-105'
                            : 'bg-stone-200 text-stone-400 cursor-not-allowed'}
                        `}
                      >
                        この日に送る
                      </button>
                      <button
                        onClick={() => { setError(''); setStep(aiSkipped ? 'compose' : 'reply'); }}
                        className="japanese-sans text-base font-medium text-stone-500 hover:text-stone-700 transition-colors"
                      >
                        戻る
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ---------------- 完了 ---------------- */}
            {step === 'done' && (
              <div className="max-w-2xl mx-auto">
                <div className="p-8 md:p-12 rounded-sm letter-shadow paper-texture animate-fade-in-up text-center
                                bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50">
                  <div className="w-20 h-20 mx-auto mb-6 opacity-70">
                    <svg viewBox="0 0 100 80" className="w-full h-full">
                      <rect x="5" y="15" width="90" height="60" rx="3" fill="#F5E6D3" stroke="#C4A574" strokeWidth="2"/>
                      <path d="M5 18 L50 50 L95 18" fill="none" stroke="#C4A574" strokeWidth="2"/>
                      <path d="M30 45 L45 60 L72 30" fill="none" stroke="#D97706" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>

                  <h2 className="japanese-serif text-2xl text-amber-800 mb-4">
                    手紙を預かりました
                  </h2>

                  <p className="japanese-sans text-lg text-stone-700 leading-relaxed">
                    1年後に届くまで、気長にお待ちください！
                  </p>
                </div>

                <div className="text-center mt-8">
                  <button
                    onClick={resetApp}
                    className="px-6 py-3 rounded-full japanese-sans text-lg font-medium text-amber-700
                               border-2 border-amber-300 hover:bg-amber-50 transition-all duration-300"
                  >
                    最初に戻る
                  </button>
                </div>
              </div>
            )}

            <footer className="mt-16 text-center space-y-1">
              {step === 'compose' && (
                <p className="japanese-sans text-base text-stone-500 font-medium">
                  返信が表示されるまで、20～40秒程度かかります
                </p>
              )}
              <p className="japanese-sans text-sm text-stone-400">
                お問い合わせ：筑波大学人間系　千島雄太　chishima.yuta.fw@u.tsukuba.ac.jp
              </p>
            </footer>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
